<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="WinClean 磁盘管家">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#16233a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <ellipse cx="1035" cy="170" rx="300" ry="240" fill="url(#glow)"/>

  <g stroke="#22314a" stroke-width="1" opacity="0.55">
    <path d="M0 60 H1280"/>
    <path d="M0 280 H1280"/>
    <path d="M120 0 V340"/>
    <path d="M1160 0 V340"/>
  </g>

  <g fill="none" stroke="url(#ring)">
    <circle cx="1035" cy="170" r="104" stroke-width="2" opacity="0.9"/>
    <circle cx="1035" cy="170" r="72" stroke-width="1.5" opacity="0.55"/>
    <circle cx="1035" cy="170" r="40" stroke-width="1.5" opacity="0.35"/>
    <path d="M1035 66 A104 104 0 0 1 1139 170" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <path d="M1035 274 A104 104 0 0 1 931 170" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  </g>
  <circle cx="1035" cy="170" r="8" fill="#60a5fa"/>

  <g font-family="'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif">
    <text x="96" y="104" font-size="13" letter-spacing="3.5" fill="#64748b">WINDOWS DESKTOP · LOCAL FIRST</text>
    <text x="94" y="184" fill="#f8fafc" font-size="72" font-weight="700" letter-spacing="-1.5">WinClean</text>
    <text x="98" y="222" fill="#94a3b8" font-size="21" letter-spacing="1">磁盘管家 · Windows Disk Space Manager</text>
    <rect x="96" y="252" width="64" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="96" y="292" fill="#cbd5e1" font-size="19">把每个文件归属到具体软件，再决定删不删</text>
  </g>
</svg>
